<nav>
  @switch (getUrlForBreadcrumb()) {
    @case ('/homepage') {
      <a routerLink="/homepage">Home</a>
    }
    @case ('/about') {
      <a routerLink="/about">About</a>
    }
    @case ('/homepage/film') {
      <a routerLink="/homepage">Home</a>
      <span> &gt; </span>
      <a routerLink="{{getCurrentUrl()}}">{{getFilmTitle()}}</a>
    }
  }
</nav>
