<search>
  <form>
    <input name="film-search" type="text" placeholder="Search for a film">
  </form>
</search>

<div class="app__film-cards-container scrollable">
  @for (film of getFilms(); track film.id) {
    <app-film-card [film]="film" (click)="onFilmCardClick($event,film)"></app-film-card>
  }
</div>
